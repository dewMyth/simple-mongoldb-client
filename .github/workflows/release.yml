name: Release

# Push a tag like v0.1.0 (matching package.json's version) to build installers on all three OSes,
# smoke-test each packaged app, and publish them as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: --mac
            exe: release/mac-universal/Mongo Studio.app/Contents/MacOS/Mongo Studio
          - os: windows-latest
            dist: --win
            exe: release/win-unpacked/Mongo Studio.exe
          - os: ubuntu-latest
            dist: --linux
            exe: release/linux-unpacked/mongo-studio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build
      - name: Build installers (unsigned)
        run: npx electron-builder ${{ matrix.dist }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        env:
          E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.exe }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb dbus-x11 gnome-keyring
          scripts/linux-e2e.sh npx playwright test smoke
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        env:
          E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.exe }}
        run: npx playwright test smoke
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Mongo Studio ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            Installers for macOS (universal dmg), Windows (x64 setup) and Linux (x64 AppImage).
            They are **not code-signed yet**: see docs/release.md for how to open them.
